# structra-scape model
# Edit this file, then run: structra build structra.yaml
version: "0.1"
name: 承認プロセスの改善
description: 承認待ちが顧客満足度と売上に与える影響を探索するモデル

nodes:
  - id: sales
    name: 売上
    type: kpi
    description: 月次売上
    position: { x: 760, y: 100 }
  - id: customer_satisfaction
    name: 顧客満足度
    type: kpi
    description: 承認速度を含む顧客体験の評価
    position: { x: 470, y: 100 }
  - id: approval_wait
    name: 承認待ち時間
    type: causal_variable
    description: 申請から承認完了までの待機時間
    relations:
      - target: manager_approval
        type: occurs_in
    validation: hypothesis
    position: { x: 140, y: 330 }
  - id: approval_volume
    name: 承認件数
    type: causal_variable
    position: { x: 390, y: 510 }
  - id: staff_load
    name: 担当者負荷
    type: causal_variable
    position: { x: 650, y: 510 }
  - id: processing_time
    name: 処理時間
    type: causal_variable
    position: { x: 820, y: 330 }
  - id: application
    name: 申請
    type: process
    owner: 申請者
    expected_duration: 15 min
    position: { x: 130, y: 720 }
  - id: manager_approval
    name: 部長承認
    type: process
    owner: 部長
    expected_duration: 4 hours
    bottleneck: true
    bottleneck_reason: 平均処理時間が想定を44時間超過し、差し戻しも多い
    metrics:
      average_duration: 2 days
      throughput: 250/day
      rework_rate: 15%
    traces: [approval_volume]
    position: { x: 430, y: 720 }
  - id: accounting_approval
    name: 経理承認
    type: process
    owner: 経理
    expected_duration: 4 hours
    position: { x: 730, y: 720 }
  - id: approval_completed
    name: ApprovalCompleted
    type: event
    description: 全承認の完了時に発生するイベント
    position: { x: 1010, y: 720 }

edges:
  - { source: approval_wait, target: customer_satisfaction, kind: causal, polarity: "-", validation: hypothesis }
  - { source: customer_satisfaction, target: sales, kind: causal, polarity: "+", validation: hypothesis }
  - { source: approval_volume, target: staff_load, kind: causal, polarity: "+", validation: hypothesis }
  - { source: staff_load, target: processing_time, kind: causal, polarity: "+", validation: hypothesis }
  - { source: processing_time, target: approval_wait, kind: causal, polarity: "+", delay: true, validation: hypothesis }
  - { source: application, target: manager_approval, kind: flow }
  - { source: manager_approval, target: accounting_approval, kind: flow }
  - { source: accounting_approval, target: approval_completed, kind: flow }
