# structra-scape model
# Edit this file, then run: strscape build structra.yaml
version: "0.1"
name: Improve customer support response time
description: Explore how support workload affects response time, customer satisfaction, and retention.

nodes:
  # Business outcomes
  - id: improve_retention
    name: Improve customer retention
    type: goal
    description: Keep more customers by improving their support experience.
    position: { x: 840, y: 80 }
  - id: customer_retention
    name: Customer retention
    type: kpi
    description: Percentage of customers who continue using the service.
    position: { x: 600, y: 180 }
  - id: customer_satisfaction
    name: Customer satisfaction
    type: kpi
    description: Customer-reported satisfaction with the support experience.
    position: { x: 340, y: 180 }

  # Causal factors: this loop describes why response time grows.
  - id: response_time
    name: First response time
    type: causal_variable
    description: Time from a customer ticket to the first human response.
    validation: hypothesis
    relations:
      - target: triage_ticket
        type: occurs_in
    position: { x: 130, y: 400 }
  - id: open_tickets
    name: Open ticket backlog
    type: causal_variable
    validation: observed
    position: { x: 370, y: 560 }
  - id: agent_workload
    name: Agent workload
    type: causal_variable
    validation: hypothesis
    position: { x: 690, y: 560 }
  - id: resolution_time
    name: Resolution time
    type: causal_variable
    validation: hypothesis
    position: { x: 920, y: 400 }

  # Processes: expected duration is the target; metrics are observed values.
  - id: receive_ticket
    name: Receive ticket
    type: process
    owner: Support system
    expected_duration: 5 min
    position: { x: 120, y: 760 }
  - id: triage_ticket
    name: Triage ticket
    type: process
    owner: Support team
    expected_duration: 30 min
    bottleneck: true
    bottleneck_reason: Average triage time exceeds the target and creates a growing backlog.
    metrics:
      average_duration: 6 hours
      throughput: 180/day
      rework_rate: 12%
    traces: [agent_workload]
    position: { x: 420, y: 760 }
  - id: resolve_ticket
    name: Resolve ticket
    type: process
    owner: Support team
    expected_duration: 4 hours
    position: { x: 720, y: 760 }
  - id: ticket_resolved
    name: TicketResolved
    type: event
    description: Emitted when a customer support ticket is resolved.
    position: { x: 1010, y: 760 }

edges:
  # Higher response time lowers satisfaction, which lowers retention.
  - { source: response_time, target: customer_satisfaction, kind: causal, polarity: "-", validation: hypothesis }
  - { source: customer_satisfaction, target: customer_retention, kind: causal, polarity: "+", validation: hypothesis }
  - { source: customer_retention, target: improve_retention, kind: causal, polarity: "+", validation: observed }

  # Reinforcing backlog loop. The delay represents the time before slow resolution grows the backlog.
  - { source: open_tickets, target: agent_workload, kind: causal, polarity: "+", validation: hypothesis }
  - { source: agent_workload, target: resolution_time, kind: causal, polarity: "+", validation: hypothesis }
  - { source: resolution_time, target: response_time, kind: causal, polarity: "+", validation: hypothesis }
  - { source: response_time, target: open_tickets, kind: causal, polarity: "+", delay: true, validation: hypothesis }

  # Operational flow.
  - { source: receive_ticket, target: triage_ticket, kind: flow }
  - { source: triage_ticket, target: resolve_ticket, kind: flow }
  - { source: resolve_ticket, target: ticket_resolved, kind: flow }
