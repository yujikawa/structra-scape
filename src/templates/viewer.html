<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>structra-scape</title>
<style>
  :root{font-family:Inter,ui-sans-serif,system-ui;color:#e7eefc;background:#0c1220}*{box-sizing:border-box}body{margin:0}header{height:64px;display:flex;align-items:center;gap:18px;padding:0 24px;border-bottom:1px solid #26334d;background:#10192b}h1{font-size:18px;margin:0;letter-spacing:.05em}header p{margin:0;color:#9eacc5;font-size:13px}main{display:grid;grid-template-columns:220px minmax(0,1fr) 270px;height:calc(100vh - 64px);min-height:560px}aside{background:#10192b;border-right:1px solid #26334d;padding:18px 14px;overflow:auto}#detail{border-right:0;border-left:1px solid #26334d}.eyebrow{color:#8ba2c9;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin:0 0 7px}h2{font-size:16px;margin:0 0 15px}h3{font-size:13px;color:#b9c7df;margin:18px 0 8px}.tabs{display:grid;gap:6px}button{color:#dce7fa;font:inherit;text-align:left;background:#16223a;border:1px solid #2b3b59;border-radius:7px;cursor:pointer;padding:9px}button:hover,button.active{background:#243960;border-color:#77a7ff}.count{float:right;color:#9bafd1;font-size:12px}.legend{display:grid;gap:7px;color:#a7b6d2;font-size:12px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}#graph{min-width:0;position:relative;background-color:#0c1220;background-image:radial-gradient(#273650 1px,transparent 1px);background-size:22px 22px}#cy{position:absolute;inset:0}.tools{position:absolute;z-index:2;top:14px;right:14px;display:flex;gap:6px;padding:6px;border:1px solid #344765;border-radius:9px;background:#10192be8;box-shadow:0 6px 18px #0005}.tools button{min-width:34px;padding:7px 9px;text-align:center;font-weight:700}.tools #zoom-level{min-width:52px;color:#aebfe0}.detail-empty{color:#8e9db9;font-size:13px;line-height:1.6}dl{margin:0}dt{color:#8e9db9;font-size:11px;margin-top:14px;text-transform:uppercase;letter-spacing:.06em}dd{margin:4px 0;line-height:1.5;font-size:13px}.related{margin-top:8px;display:grid;gap:5px}.related button{font-size:12px;padding:8px}@media(max-width:800px){main{grid-template-columns:150px minmax(380px,1fr) 190px}aside{padding:14px 10px}}
</style></head><body>
<header><h1>structra-scape</h1><p id="subtitle"></p></header><main>
<aside><p class="eyebrow">Perspective</p><h2>表示レイヤー</h2><div class="tabs" id="tabs"></div><h3>ノード種別</h3><div class="legend" id="legend"></div></aside>
<section id="graph"><div class="tools"><button id="zoom-out" title="縮小">−</button><button id="zoom-level" title="全体表示">100%</button><button id="zoom-in" title="拡大">＋</button><button id="fit-view" title="全体を表示">Fit</button></div><div id="cy"></div></section>
<aside id="detail"><p class="eyebrow">Explore</p><h2>詳細</h2><div id="detail-body" class="detail-empty">ノードを選ぶと、説明と別レイヤーの関連要素を確認できます。</div></aside></main>
<script><!-- STRUCTRA_CYTOSCAPE_BUNDLE --></script><script>
<!-- STRUCTRA_MODEL_DATA -->
const model=window.__STRUCTRA_MODEL__, palettes={goal:'#f0b854',kpi:'#58c7a3',causal_variable:'#a78bfa',process:'#67a5e9',event:'#f5839a'},labels={business:'Business',causal:'Causal loop',process:'Process',event:'Event'},types={goal:'Goal',kpi:'KPI',causal_variable:'Causal variable',process:'Process',event:'Event'};
document.title=`${model.name} | structra-scape`;document.querySelector('#subtitle').textContent=model.description||model.name;const byId=new Map(model.nodes.map(n=>[n.id,n]));let activeLayer='all';
const elements=[...model.nodes.map(n=>({group:'nodes',data:{id:n.id,label:n.name,type:n.type,layer:n.layer,color:palettes[n.type]},position:n.position})),...model.edges.map((e,i)=>({group:'edges',data:{id:`edge-${i}`,source:e.source,target:e.target,kind:e.kind||'link',polarity:e.polarity||'',color:e.polarity==='+'?'#3ecf8e':e.polarity==='-'?'#ff7185':e.kind==='flow'?'#6ea5ee':'#a48add'}}))];
const cy=cytoscape({container:document.querySelector('#cy'),elements,layout:{name:'preset'},minZoom:.2,maxZoom:2.5,wheelSensitivity:.18,style:[{selector:'node',style:{label:'data(label)',width:180,height:70,'background-color':'#142039','border-width':2,'border-color':'data(color)',shape:'round-rectangle',color:'#e7eefc','font-size':14,'font-weight':600,'text-valign':'center','text-halign':'center','text-wrap':'wrap','text-max-width':145}},{selector:'node[type="causal_variable"]',style:{'background-color':'#a78bfa','background-opacity':.14,'border-width':1,'border-opacity':.45,'border-color':'#bda5ff',shape:'round-rectangle',color:'#e5dcff','font-size':16,'font-weight':700}},{selector:'node[type="process"]',style:{shape:'rectangle'}},{selector:'node[type="event"]',style:{shape:'round-rectangle',height:58}},{selector:'edge',style:{width:2,'line-color':'data(color)','target-arrow-color':'data(color)','target-arrow-shape':'triangle','curve-style':'bezier','arrow-scale':1.35,label:'data(polarity)',color:'data(color)','font-size':16,'font-weight':800,'text-background-color':'#0c1220','text-background-opacity':1,'text-background-padding':3,'text-rotation':'autorotate'}},{selector:'edge[kind="link"]',style:{'line-style':'dashed'}},{selector:'.dimmed',style:{opacity:.1}},{selector:':selected',style:{'overlay-color':'#fff','overlay-opacity':.12,'overlay-padding':6}}]});
const tabs=document.querySelector('#tabs');['all','business','causal','process','event'].forEach(layer=>{const count=layer==='all'?model.nodes.length:model.nodes.filter(n=>n.layer===layer).length,b=document.createElement('button');b.dataset.layer=layer;b.innerHTML=`${layer==='all'?'すべて':labels[layer]} <span class="count">${count}</span>`;b.onclick=()=>setLayer(layer);tabs.append(b)});const legend=document.querySelector('#legend');Object.entries(types).forEach(([type,label])=>legend.innerHTML+=`<span><i class="dot" style="background:${palettes[type]}"></i>${label}</span>`);
function setLayer(layer){activeLayer=layer;cy.elements().removeClass('dimmed');if(layer!=='all'){cy.nodes().filter(node=>node.data('layer')!==layer).addClass('dimmed');cy.edges().forEach(edge=>{if(edge.source().data('layer')!==layer||edge.target().data('layer')!==layer)edge.addClass('dimmed')})}document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.layer===layer))}
function showDetail(id){const node=byId.get(id),related=new Set(node.links||[]);model.edges.forEach(e=>{if(e.source===id)related.add(e.target);if(e.target===id)related.add(e.source)});const fields=[['タイプ',types[node.type]],['レイヤー',labels[node.layer]],['説明',node.description],['担当',node.owner],['所要時間',node.duration],['メモ',node.note]].filter(([,v])=>v);const panel=document.querySelector('#detail-body');panel.className='';panel.innerHTML=`<h3 style="font-size:18px;color:${palettes[node.type]};margin-top:0">${node.name}</h3><dl>${fields.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>${related.size?`<h3>関連する要素</h3><div class="related">${[...related].map(r=>`<button data-id="${r}">${byId.get(r)?.name||r}<span class="count">${labels[byId.get(r)?.layer]||''}</span></button>`).join('')}</div>`:''}`;panel.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{setLayer('all');cy.$id(b.dataset.id).select();cy.animate({center:{eles:cy.$id(b.dataset.id)},duration:250});showDetail(b.dataset.id)})}
cy.on('tap','node',event=>showDetail(event.target.id()));document.querySelector('#zoom-in').onclick=()=>cy.zoom({level:Math.min(cy.maxZoom(),cy.zoom()*1.2),renderedPosition:{x:cy.width()/2,y:cy.height()/2}});document.querySelector('#zoom-out').onclick=()=>cy.zoom({level:Math.max(cy.minZoom(),cy.zoom()/1.2),renderedPosition:{x:cy.width()/2,y:cy.height()/2}});document.querySelector('#fit-view').onclick=()=>cy.fit(cy.elements(),40);document.querySelector('#zoom-level').onclick=()=>cy.fit(cy.elements(),40);cy.on('zoom',()=>document.querySelector('#zoom-level').textContent=`${Math.round(cy.zoom()*100)}%`);setLayer('all');cy.fit(cy.elements(),40);
</script></body></html>
