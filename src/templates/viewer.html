<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>structra-scape</title>
<style>
  :root{font-family:Inter,ui-sans-serif,system-ui;color:#e7eefc;background:#0c1220}*{box-sizing:border-box}body{margin:0}header{height:64px;display:flex;align-items:center;gap:18px;padding:0 24px;border-bottom:1px solid #26334d;background:#10192b}.brand{display:flex;align-items:center;gap:9px;min-width:max-content}.brand svg{width:31px;height:31px;filter:drop-shadow(0 2px 6px #0008)}h1{font-size:18px;margin:0;letter-spacing:.05em}header p{margin:0;color:#9eacc5;font-size:13px}header select{max-width:260px;color:#dce7fa;background:#16223a;border:1px solid #2b3b59;border-radius:6px;padding:7px}main{display:grid;grid-template-columns:220px minmax(0,1fr) 270px;height:calc(100vh - 64px);min-height:560px}aside{background:#10192b;border-right:1px solid #26334d;padding:18px 14px;overflow:auto}#detail{border-right:0;border-left:1px solid #26334d}.eyebrow{color:#8ba2c9;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin:0 0 7px}h2{font-size:16px;margin:0 0 15px}h3{font-size:13px;color:#b9c7df;margin:18px 0 8px}.tabs{display:grid;gap:6px}button{color:#dce7fa;font:inherit;text-align:left;background:#16223a;border:1px solid #2b3b59;border-radius:7px;cursor:pointer;padding:9px}button:hover,button.active{background:#243960;border-color:#77a7ff}.count{float:right;color:#9bafd1;font-size:12px}.legend{display:grid;gap:7px;color:#a7b6d2;font-size:12px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}#graph{min-width:0;position:relative;background-color:#0c1220;background-image:radial-gradient(#273650 1px,transparent 1px);background-size:22px 22px}#cy{position:absolute;inset:0}.tools{position:absolute;z-index:2;top:14px;right:14px;display:flex;gap:6px;padding:6px;border:1px solid #344765;border-radius:9px;background:#10192be8;box-shadow:0 6px 18px #0005}.tools button{min-width:34px;padding:7px 9px;text-align:center;font-weight:700}.tools #zoom-level{min-width:52px;color:#aebfe0}.detail-empty{color:#8e9db9;font-size:13px;line-height:1.6}dl{margin:0}dt{color:#8e9db9;font-size:11px;margin-top:14px;text-transform:uppercase;letter-spacing:.06em}dd{margin:4px 0;line-height:1.5;font-size:13px}.related{margin-top:8px;display:grid;gap:5px}.related button{font-size:12px;padding:8px}@media(max-width:800px){main{grid-template-columns:150px minmax(380px,1fr) 190px}aside{padding:14px 10px}}
</style></head><body>
<style>#graph{background-color:#e1e5eb;background-image:radial-gradient(#aeb9c8 1px,transparent 1px)}#graph .tools{border-color:#bcc8d8;background:#fffffff0;box-shadow:0 6px 18px #15243a20}#graph .tools button{color:#314967;background:#f4f7fb;border-color:#cbd5e2}#graph .tools button:hover{background:#e5edf8;border-color:#77a7ff}#graph .tools #zoom-level{color:#566d89}</style><header><div class="brand"><!-- STRUCTRA_LOGO --><h1>structra-scape</h1></div><select id="model-selector" aria-label="Select model"></select><p id="subtitle"></p></header><main>
<aside><p class="eyebrow">Explore</p><h2>Views</h2><div class="tabs" id="tabs"></div><h3>Legend</h3><div class="legend" id="legend"></div><h3>Causal guide</h3><div class="legend"><span><i class="dot" style="background:#3ecf8e"></i>⊕ Changes in the same direction</span><span><i class="dot" style="background:#ff7185"></i>⊖ Changes in the opposite direction</span><span>∥ Delay in the causal effect</span><span>Dashed line: hypothesis to validate</span></div></aside>
<section id="graph"><div class="tools"><button id="zoom-out" title="Zoom out">−</button><button id="zoom-level" title="Fit to view">100%</button><button id="zoom-in" title="Zoom in">＋</button><button id="fit-view" title="Fit to view">Fit</button></div><div id="cy"></div></section>
<aside id="detail"><p class="eyebrow">Inspect</p><h2>Details</h2><div id="detail-body" class="detail-empty">Select a node to explore its context and related structures.</div></aside></main>
<script><!-- STRUCTRA_CYTOSCAPE_BUNDLE --></script><script>
<!-- STRUCTRA_MODEL_DATA -->
const sourceModels=window.__STRUCTRA_DATA__.models, requestedModel=new URLSearchParams(location.search).get('model'), selectedModel=sourceModels.find(entry=>entry.slug===requestedModel)||sourceModels[0];window.__STRUCTRA_MODEL__=selectedModel.model;
const model=window.__STRUCTRA_MODEL__, palettes={goal:'#f0b854',kpi:'#58c7a3',causal_variable:'#a78bfa',process:'#67a5e9',event:'#f5839a'},labels={business:'Business View',causal:'Causal View',process:'Process View',event:'Event View'},types={goal:'Goal',kpi:'KPI',causal_variable:'Factor',process:'Process',event:'Event'},validationLabels={hypothesis:'Hypothesis',observed:'Observed',validated:'Validated',rejected:'Rejected'},relationLabels={occurs_in:'Occurs in',affects:'Affects',derived_from:'Derived from',produces:'Produces',consumes:'Consumes'},viewForType=type=>({goal:'business',kpi:'business',causal_variable:'causal',process:'process',event:'event'})[type];
document.title=`${model.name} | structra-scape`;document.querySelector('#subtitle').textContent=model.description||model.name;const byId=new Map(model.nodes.map(n=>[n.id,n]));let activeLayer='all';
const modelSelector=document.querySelector('#model-selector');sourceModels.forEach(entry=>{const option=document.createElement('option');option.value=entry.slug;option.textContent=entry.name;option.selected=entry.slug===selectedModel.slug;modelSelector.append(option)});modelSelector.hidden=sourceModels.length<2;modelSelector.onchange=()=>{const url=new URL(location.href);url.searchParams.set('model',modelSelector.value);location.href=url};
const relationEdges=model.nodes.flatMap(node=>(node.relations||[]).map((relation,index)=>({group:'edges',data:{id:`relation-${node.id}-${index}`,source:node.id,target:relation.target,kind:'relation',polarity:'',edgeLabel:relation.type==='occurs_in'?'Occurs in':'',color:'#7450ad'}})));const elements=[...model.nodes.map(n=>({group:'nodes',data:{id:n.id,label:n.name,type:n.type,layer:viewForType(n.type),validation:n.validation||'',bottleneck:n.bottleneck?1:0,color:palettes[n.type]},position:n.position})),...model.edges.map((e,i)=>({group:'edges',data:{id:`edge-${i}`,source:e.source,target:e.target,kind:e.kind||'flow',polarity:e.polarity||'',validation:e.validation||'',curveDistance:e.kind==='causal'?(i%2===0?80:-80):0,edgeLabel:(e.polarity==='+'?'⊕':e.polarity==='-'?'⊖':'')+(e.delay?'  ∥':''),color:e.polarity==='+'?'#13855c':e.polarity==='-'?'#d4405d':e.kind==='flow'?'#3e72b3':'#7450ad'}})),...relationEdges];
const cy=cytoscape({container:document.querySelector('#cy'),elements,layout:{name:'preset'},minZoom:.2,maxZoom:2.5,wheelSensitivity:.8,style:[{selector:'node',style:{label:'data(label)',width:180,height:70,'background-color':'#fbfcfe','border-width':2,'border-color':'data(color)',shape:'round-rectangle',color:'#263b57','font-size':14,'font-weight':600,'text-valign':'center','text-halign':'center','text-wrap':'wrap','text-max-width':145}},{selector:'node[validation="hypothesis"]',style:{'border-style':'dashed'}},{selector:'node[validation="validated"]',style:{'border-color':'#58c7a3'}},{selector:'node[validation="rejected"]',style:{opacity:.42}},{selector:'node[type="causal_variable"]',style:{'background-color':'#e6defa','background-opacity':.98,'border-width':1,'border-opacity':.9,'border-color':'#856abe',shape:'round-rectangle',color:'#392a61','font-size':16,'font-weight':700}},{selector:'node[bottleneck = 1]',style:{'border-color':'#dc7e31','border-width':3,'background-color':'#fff0e3',color:'#6a3510'}},{selector:'node[type="process"]',style:{shape:'rectangle'}},{selector:'node[type="event"]',style:{shape:'round-rectangle',height:58}},{selector:'edge',style:{width:2,'line-color':'data(color)','target-arrow-color':'data(color)','target-arrow-shape':'triangle','curve-style':'straight','arrow-scale':1.35,label:'data(edgeLabel)',color:'data(color)','font-size':24,'font-weight':900,'text-outline-color':'#e1e5eb','text-outline-width':3,'text-rotation':'autorotate'}},{selector:'edge[kind="causal"]',style:{'curve-style':'unbundled-bezier','control-point-distances':'data(curveDistance)','control-point-weights':.5}},{selector:'edge[kind="relation"]',style:{'line-style':'dashed','line-opacity':.65,'font-size':12,'font-weight':700,'text-outline-width':2}},{selector:'edge[validation="hypothesis"]',style:{'line-style':'dashed'}},{selector:'edge.impact',style:{opacity:1,'line-opacity':1,width:4}},{selector:'.dimmed',style:{opacity:.1}},{selector:':selected',style:{'overlay-color':'#fff','overlay-opacity':.12,'overlay-padding':6}}]});
const tabs=document.querySelector('#tabs');['all','business','causal','process','event'].forEach(layer=>{const count=layer==='all'?model.nodes.length:model.nodes.filter(n=>viewForType(n.type)===layer).length,b=document.createElement('button');b.dataset.layer=layer;b.textContent=`${layer==='all'?'All Views':labels[layer]} (${count})`;b.title=`Show ${count} nodes`;b.onclick=()=>setLayer(layer);tabs.append(b)});const legend=document.querySelector('#legend');Object.entries(types).forEach(([type,label])=>legend.innerHTML+=`<span><i class="dot" style="background:${palettes[type]}"></i>${label}</span>`);
function setLayer(layer){activeLayer=layer;cy.elements().removeClass('dimmed');if(layer!=='all'){cy.nodes().filter(node=>node.data('layer')!==layer).addClass('dimmed');cy.edges().forEach(edge=>{if(edge.source().data('layer')!==layer||edge.target().data('layer')!==layer)edge.addClass('dimmed')})}document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.layer===layer))}
function hours(value){const match=String(value||'').match(/([\d.]+)\s*(days?|hours?|hrs?|minutes?|mins?)/i);if(!match)return null;const units=match[2].toLowerCase();return Number(match[1])*(units.startsWith('day')?24:units.startsWith('hour')||units.startsWith('hr')?1:1/60)}function button(id){const target=byId.get(id);return `<button data-id="${id}">${target?.name||id}<span class="count">${labels[viewForType(target?.type)]||''}</span></button>`}function showDetail(id){const node=byId.get(id),traces=new Set(node.traces||[]),relations=[],related=new Set();(node.relations||[]).forEach(r=>{related.add(r.target);relations.push(`${relationLabels[r.type]||r.type}: ${byId.get(r.target)?.name||r.target}`)});model.nodes.forEach(other=>(other.relations||[]).filter(r=>r.target===id).forEach(r=>{related.add(other.id);relations.push(`${relationLabels[r.type]||r.type}: ${other.name}`)}));model.edges.forEach(e=>{if(e.source===id)related.add(e.target);if(e.target===id)related.add(e.source)});const expected=hours(node.expected_duration),actual=hours(node.metrics?.average_duration),gap=expected!==null&&actual!==null?actual-expected:null;const fields=[['Type',types[node.type]],['View',labels[viewForType(node.type)]],['Description',node.description],['Owner',node.owner],['Expected duration',node.expected_duration],['Average duration',node.metrics?.average_duration],['Variance',gap===null?null:`${gap>=0?'+':''}${gap.toFixed(gap%1?1:0)} hours`],['Validation',validationLabels[node.validation]||node.validation],['Evidence',Array.isArray(node.evidence)?node.evidence.join(', '):node.evidence],['Bottleneck',node.bottleneck?'Yes':null],['Bottleneck reason',node.bottleneck_reason],...Object.entries(node.metrics||{}).filter(([k])=>k!=='average_duration').map(([k,v])=>[`Metric: ${k}`,v])].filter(([,v])=>v);const panel=document.querySelector('#detail-body');panel.className='';panel.innerHTML=`<h3 style="font-size:18px;color:${palettes[node.type]};margin-top:0">${node.name}</h3><dl>${fields.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>${relations.length?`<h3>Model relations</h3><div class="detail-empty">${relations.join('<br>')}</div>`:''}${traces.size?`<h3>Investigate next</h3><div class="related">${[...traces].map(button).join('')}</div>`:''}${related.size?`<h3>Related elements</h3><div class="related">${[...related].filter(r=>!traces.has(r)).map(button).join('')}</div>`:''}`;panel.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{setLayer('all');cy.$id(b.dataset.id).select();cy.animate({center:{eles:cy.$id(b.dataset.id)},duration:250});showDetail(b.dataset.id)})}
function highlightImpact(id){const ids=new Set([id]),queue=[id];while(queue.length){const current=queue.shift();model.edges.filter(edge=>['causal','flow'].includes(edge.kind)&& (edge.source===current||edge.target===current)).forEach(edge=>{const next=edge.source===current?edge.target:edge.source;if(!ids.has(next)){ids.add(next);queue.push(next)}})}cy.elements().removeClass('impact').addClass('dimmed');cy.nodes().filter(node=>ids.has(node.id())).removeClass('dimmed').addClass('impact');cy.edges().filter(edge=>ids.has(edge.source().id())&&ids.has(edge.target().id())).removeClass('dimmed').addClass('impact')}cy.on('tap',event=>{if(event.target===cy)setLayer(activeLayer)});cy.on('tap','node',event=>{showDetail(event.target.id());highlightImpact(event.target.id())});document.querySelector('#zoom-in').onclick=()=>cy.zoom({level:Math.min(cy.maxZoom(),cy.zoom()*1.2),renderedPosition:{x:cy.width()/2,y:cy.height()/2}});document.querySelector('#zoom-out').onclick=()=>cy.zoom({level:Math.max(cy.minZoom(),cy.zoom()/1.2),renderedPosition:{x:cy.width()/2,y:cy.height()/2}});document.querySelector('#fit-view').onclick=()=>cy.fit(cy.elements(),40);document.querySelector('#zoom-level').onclick=()=>cy.fit(cy.elements(),40);cy.on('zoom',()=>document.querySelector('#zoom-level').textContent=`${Math.round(cy.zoom()*100)}%`);setLayer('all');cy.fit(cy.elements(),40);
</script></body></html>
