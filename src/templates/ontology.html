<header><div class="brand"><!-- STRUCTRA_LOGO -->structra-scape</div><select id="model-choice" aria-label="モデルを選択"></select><button id="open">YAMLを開く</button><button id="save">YAMLを保存</button><button id="review-toggle">みんなで確認</button><span id="dirty"></span><input type="file" id="file" accept=".yaml,.yml,.json" hidden></header>

<script><!-- STRUCTRA_CYTOSCAPE_BUNDLE --></script><script><!-- YAML_BUNDLE --></script><script>
<!-- STRUCTRA_MODEL_DATA -->
<!-- ONTOLOGY_CORE -->
const $=id=>document.getElementById(id), entries=window.__STRUCTRA_DATA__.models;
let model=structuredClone(entries[0].model), selected={kind:'concept',id:model.concepts[0]?.id}, dirty=false;
let connecting=false, connectionSource=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const option=(value,label,current)=>`<option value="${esc(value)}" ${value===current?'selected':''}>${esc(label)}</option>`;
const conceptOptions=(current,empty=false)=>(empty?option('','なし',current):'')+model.concepts.map(c=>option(c.id,c.name,current)).join('');
const cy=cytoscape({container:$('cy'),elements:[],layout:{name:'grid'},style:[{selector:'node',style:{label:'data(label)',shape:'round-rectangle',width:150,height:65,'background-color':'#fff','border-width':2,'border-color':'#278b88',color:'#193953','text-valign':'center','text-wrap':'wrap','text-max-width':135,'font-size':14}},{selector:'edge',style:{label:'data(label)','curve-style':'bezier','target-arrow-shape':'triangle','line-color':'#6c839d','target-arrow-color':'#6c839d','font-size':11,'text-background-color':'#eef3f7','text-background-opacity':1,'text-background-padding':4}},{selector:'edge[kind="parent"]',style:{'line-style':'dashed'}},{selector:'edge[kind="restriction"]',style:{'line-style':'dotted','line-color':'#087e75','target-arrow-color':'#087e75'}},{selector:':selected',style:{'overlay-opacity':.12,'overlay-color':'#009c8d'}}]});
function status(message,error=false){$('status').textContent=message;$('status').classList.toggle('error',error)}
function mark(){dirty=true;$('dirty').textContent='未保存の変更あり'}
function refresh(layout=false){
  $('name').value=model.name;$('base').value=model.base;
  renderLists();
  const positions=new Map(cy.nodes().map(n=>[n.id(),n.position()]));
  cy.elements().remove();cy.add([...model.concepts.map(c=>({data:{id:c.id,label:c.name},position:positions.get(c.id)||c.position})),...model.concepts.filter(c=>c.parent).map(c=>({data:{id:'parent:'+c.id,source:c.id,target:c.parent,label:'〜の一種',kind:'parent',ref:c.id}})),...model.properties.map(p=>({data:{id:'property:'+p.id,source:p.domain,target:p.range,label:p.name,kind:'property',ref:p.id}})),...model.restrictions.filter(r=>r.target&&r.operator.endsWith('ValuesFrom')).map((r,i)=>({data:{id:'restriction:'+i,source:r.subject,target:r.target,label:term(r.property)+(r.operator==='someValuesFrom'?'：1つ以上':'：相手はすべて'),kind:'restriction',ref:r.subject}}))]);
  if(layout&&!model.concepts.every(c=>c.position)){
    // Ontology relationships can be cyclic: a directed hierarchy collapses them into one row.
    // Seed a grid, then spread connected terms in two dimensions without changing the YAML.
    cy.layout({name:'grid',fit:false,avoidOverlap:true,spacingFactor:1.4}).run();
    cy.layout({name:'cose',animate:false,randomize:false,padding:55,
      nodeRepulsion:()=>12000,idealEdgeLength:()=>160,componentSpacing:100,
      nodeOverlap:20,numIter:1000}).run();
  }
  detail();updateReview();
}
function detail(){
  const isConcept=selected.kind==='concept', item=(isConcept?model.concepts:model.properties).find(x=>x.id===selected.id);
  if(!item){$('detail').innerHTML='<p class="empty">概念または関係を追加・選択してください。</p>';return}
  $('detail').innerHTML=`<h2>${esc(item.name)}</h2><div class="meaning-card">${esc(isConcept ? (item.parent ? `${item.name}は、${term(item.parent)}の一種です。` : `${item.name}とは何か、説明と例をそろえましょう。`) : `${term(item.domain)} → ${item.name} → ${term(item.range)}`)}</div><label for="item-name">名前</label><input id="item-name" value="${esc(item.name)}"><label for="description">どんな意味？</label><textarea id="description">${esc(item.description||'')}</textarea>${isConcept?`<label for="parent">何の一種？（任意）</label><select id="parent">${conceptOptions(item.parent,true)}</select>`:`<label for="domain">つながりの始点</label><select id="domain">${conceptOptions(item.domain)}</select><label for="range">つながる相手</label><select id="range">${conceptOptions(item.range)}</select><p class="hint">このつながりがある対象は、ここで選んだ始点・相手の種類に属するものとして定義します。</p>`}<label for="example">たとえば？</label><textarea id="example" placeholder="当てはまる具体例を書きます">${esc(item.example||'')}</textarea><label for="question">まだ決まっていないこと</label><textarea id="question" placeholder="例：契約が終了した会社も顧客に含める？">${esc(item.question||'')}</textarea><label for="review-state">話し合いの状態</label><select id="review-state">${option('draft','考え中',item.review_state||'draft')}${option('discussion','要相談',item.review_state)}${option('agreed','合意済み',item.review_state)}</select><div class="actions apply-actions"><button id="apply">内容を反映</button></div><button class="danger" id="delete">${isConcept?'概念':'関係'}を削除</button>${isConcept?'<h3>このことばの条件</h3><div id="rules"></div><button id="add-rule">＋ 条件を追加</button><p class="hint">「この条件で呼び分ける」を選んだ条件は、種類とあわせてすべて満たすことが必要です。「必ず満たす」だけでは、逆向きに分類しません。</p>':''}`;
  $('apply').onclick=()=>{const previous=structuredClone(item);item.name=$('item-name').value;item.description=$('description').value;item.example=$('example').value;item.question=$('question').value;item.review_state=$('review-state').value;if(isConcept)item.parent=$('parent').value;else{item.domain=$('domain').value;item.range=$('range').value}const errors=validateOntology(model);if(errors.length){Object.keys(item).forEach(k=>delete item[k]);Object.assign(item,previous);return status(errors.join('\n'),true)}mark();status('定義を反映しました。YAMLで保存できます。');refresh()};
  $('delete').onclick=()=>{const used=isConcept?model.concepts.some(c=>c.parent===item.id)||model.properties.some(p=>p.domain===item.id||p.range===item.id)||model.restrictions.some(r=>r.subject===item.id||r.target===item.id):model.restrictions.some(r=>r.property===item.id);if(used)return status('この項目は参照されています。先に関連する条件・関係を編集または削除してください。',true);model[isConcept?'concepts':'properties']=model[isConcept?'concepts':'properties'].filter(x=>x.id!==item.id);mark();refresh(true)};
  if(!isConcept)return;
  if(typeof showUsages==='function')showUsages(item);
  $('rules').innerHTML=model.restrictions.map((r,i)=>r.subject===item.id?`<div class="rule"><p>${esc(businessRule(r))}</p><span class="condition-tag">${r.mode==='equivalent'?'この条件で呼び分ける':'必ず満たす条件'}</span><div class="actions"><button data-edit="${i}">編集</button><button data-remove="${i}">削除</button></div></div>`:'').join('')||'<p class="hint">条件はまだありません。</p>';
  $('rules').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{model.restrictions.splice(Number(b.dataset.remove),1);mark();refresh()});
  $('rules').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>ruleForm(Number(b.dataset.edit)));
  $('add-rule').onclick=()=>ruleForm();
}
function ruleForm(index){
  if(!model.properties.length)return status('先に関係を追加してください。',true);
  const r=index===undefined?{subject:selected.id,property:model.properties[0].id,operator:'someValuesFrom',target:model.concepts[0].id,count:1,mode:'necessary'}:model.restrictions[index];
  $('rules').innerHTML=`<div class="rule"><label for="r-property">関係</label><select id="r-property">${model.properties.map(p=>option(p.id,p.name,r.property)).join('')}</select><label for="r-operator">条件の意味</label><select id="r-operator">${Object.entries(restrictionLabels).map(([v,l])=>option(v,l,r.operator)).join('')}</select><div id="target-field"><label for="r-target">つながる相手</label><select id="r-target">${conceptOptions(r.target)}</select></div><div id="count-field"><label for="r-count">異なる関係先の数</label><input id="r-count" type="number" min="0" step="1" value="${r.count??1}"></div><label for="r-mode">分類との関係</label><select id="r-mode">${option('necessary','このことばに当てはまるなら、必ず満たす',r.mode)}${option('equivalent','この条件で、このことばに当てはまるか決める',r.mode)}</select><p id="rule-preview" class="meaning-card"></p><p class="hint">情報がないだけでは「当てはまらない」とは決めません。個数は重複を除いた相手の数です。</p><div class="actions"><button id="r-save">条件を反映</button><button id="r-cancel">キャンセル</button></div></div>`;
  const toggle=()=>{const value=$('r-operator').value.endsWith('ValuesFrom');$('target-field').hidden=!value;$('count-field').hidden=value};const preview=()=>{toggle();$('rule-preview').textContent=businessRule({subject:selected.id,property:$('r-property').value,operator:$('r-operator').value,target:$('r-target').value,count:Number($('r-count').value),mode:$('r-mode').value})};for(const id of ['r-operator','r-property','r-target','r-count','r-mode'])$(id).oninput=preview;preview();
  $('r-cancel').onclick=detail;$('r-save').onclick=()=>{const next={subject:selected.id,property:$('r-property').value,operator:$('r-operator').value,mode:$('r-mode').value};if(next.operator.endsWith('ValuesFrom'))next.target=$('r-target').value;else next.count=$('r-count').value===''?NaN:Number($('r-count').value);const draft=structuredClone(model);if(index===undefined)draft.restrictions.push(next);else draft.restrictions[index]=next;const errors=validateOntology(draft);if(errors.length)return status(errors.join('\n'),true);model=draft;mark();status('条件を反映しました。');refresh()};
}
function nextPosition(extent,id){const center={x:(extent.x1+extent.x2)/2,y:(extent.y1+extent.y2)/2};for(let ring=0;ring<model.concepts.length+2;ring++){for(let dx=-ring;dx<=ring;dx++){for(let dy=-ring;dy<=ring;dy++){if(Math.max(Math.abs(dx),Math.abs(dy))!==ring)continue;const p={x:center.x+dx*195,y:center.y+dy*110};if(!cy.nodes().some(n=>n.id()!==id&&Math.abs(n.position('x')-p.x)<180&&Math.abs(n.position('y')-p.y)<95))return p;}}}return center;}
function nextId(prefix){let i=1;while([...model.concepts,...model.properties].some(x=>x.id===prefix+i))i++;return prefix+i}
function renderLists(){
  const query=$('search').value.trim().toLowerCase();
  for(const [key,kind] of [['concepts','concept'],['properties','property']]){
    const items=model[key].filter(x=>`${x.name} ${x.id}`.toLowerCase().includes(query));
    $(kind+'-count').textContent=`${items.length} / ${model[key].length}`;
    $(key).innerHTML=items.map(x=>`<button data-id="${esc(x.id)}" class="${selected.id===x.id?'active':''}">${esc(x.name)}${kind==='property'?`<small>${esc(model.concepts.find(c=>c.id===x.domain)?.name)} → ${esc(model.concepts.find(c=>c.id===x.range)?.name)}</small>`:''}</button>`).join('')||'<small>該当する項目はありません</small>';
    $(key).querySelectorAll('button').forEach(b=>b.onclick=()=>{if(connecting&&kind==='concept')return pickEndpoint(b.dataset.id);setReview(false);selected={kind,id:b.dataset.id};refresh();focusSelection()});
  }
}
function focusSelection(){const element=cy.$id(selected.kind==='concept'?selected.id:'property:'+selected.id);if(element.length){element.select();cy.animate({center:{eles:element},duration:180})}document.querySelector('.inspector').scrollTop=0;const active=document.querySelector('.list button.active');if(active)active.scrollIntoView({block:'nearest'});}
function connectionState(enabled,source=null){connecting=enabled;connectionSource=source;$('connect').classList.toggle('active',enabled);$('cancel-connect').hidden=!enabled;$('connect-hint').hidden=!enabled;cy.nodes().removeClass('connection-source');if(source)cy.$id(source).addClass('connection-source');$('connect-hint').textContent=source?`「${model.concepts.find(c=>c.id===source)?.name}」からつなぐ相手を選んでください。`:'始点の概念を図または一覧から選んでください。';}
function pickEndpoint(id){if(!connectionSource){connectionState(true,id);return}relationForm(connectionSource,id);connectionState(false)}
function relationForm(source=selected.kind==='concept'?selected.id:model.concepts[0]?.id,target=model.concepts[0]?.id){
  if(!model.concepts.length)return status('先に概念を追加してください。',true);
  $('detail').innerHTML=`<h2>関係を作る</h2><p class="hint">始点 → 関係の名前 → 終点</p><label for="new-source">始点の概念</label><select id="new-source">${conceptOptions(source)}</select><label for="new-relation">関係の名前</label><input id="new-relation" placeholder="例：契約を持つ"><label for="new-target">終点の概念</label><select id="new-target">${conceptOptions(target)}</select><div class="actions"><button id="create-relation">関係を作成</button><button id="discard-relation">キャンセル</button></div>`;
  document.querySelector('.inspector').scrollTop=0;$('new-relation').focus();
  $('discard-relation').onclick=detail;$('create-relation').onclick=()=>{const name=$('new-relation').value.trim();if(!name)return status('関係の名前を入力してください。',true);const id=nextId('Property');model.properties.push({id,name,domain:$('new-source').value,range:$('new-target').value});selected={kind:'property',id};$('search').value='';mark();refresh();focusSelection();status('関係を作成しました。線を選ぶと編集できます。')};
}
$('search').oninput=renderLists;
$('add-concept').onclick=()=>{setReview(false);const id=nextId('Concept'),extent=cy.extent();model.concepts.push({id,name:'新しい概念'});selected={kind:'concept',id};$('search').value='';mark();refresh();cy.$id(id).position(nextPosition(extent,id));focusSelection();$('item-name').focus();$('item-name').select();status('概念を追加しました。右側で名前を入力してください。')};
$('canvas-add').onclick=()=>$('add-concept').click();
$('add-property').onclick=()=>{setReview(false);relationForm()};
$('connect').onclick=()=>{const enabled=!connecting;setReview(false);connectionState(enabled)};
$('cancel-connect').onclick=()=>connectionState(false);
document.addEventListener('keydown',e=>{if(e.key==='Escape')connectionState(false)});
$('arrange').onclick=()=>{setReview(false);cy.layout({name:'grid',padding:65,avoidOverlap:true,spacingFactor:1.2}).run();model.concepts.forEach(c=>c.position={...cy.$id(c.id).position()});mark();updateReview()};
cy.style().selector('node.connection-source').style({'border-color':'#e49d29','border-width':5}).update();
for(const field of ['name','base'])$(field).onchange=()=>{const old=model[field];model[field]=$(field).value;const errors=validateOntology(model);if(errors.length){model[field]=old;$(field).value=old;return status(errors.join('\n'),true)}mark();refresh()};
function download(filename,text,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type}));a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('save').onclick=()=>{model.concepts.forEach(c=>{c.position={...cy.$id(c.id).position()}});const errors=validateOntology(model);if(errors.length)return status(errors.join('\n'),true);download('ontology.yaml',jsyaml.dump(model),'application/yaml');dirty=false;$('dirty').textContent='';status('YAMLのダウンロードを開始しました。')};
$('open').onclick=()=>$('file').click();$('file').onchange=async()=>{const file=$('file').files[0];if(!file)return;try{const next=jsyaml.load(await file.text()),errors=validateOntology(next);if(errors.length)throw new Error(errors.join('\n'));if(dirty&&!confirm('未保存の変更を破棄して開きますか？'))return;model=next;selected={kind:'concept',id:model.concepts[0]?.id};dirty=false;$('dirty').textContent='';$('model-choice').value='';status('モデルを読み込みました。');refresh(true)}catch(e){status(e.message,true)}finally{$('file').value=''}};
$('model-choice').innerHTML=entries.map((e,i)=>option(String(i),e.name,'0')).join('');let entryIndex='0';$('model-choice').onchange=()=>{if(dirty&&!confirm('未保存の変更を破棄して切り替えますか？')){$('model-choice').value=entryIndex;return}entryIndex=$('model-choice').value;model=structuredClone(entries[Number(entryIndex)].model);selected={kind:'concept',id:model.concepts[0]?.id};dirty=false;$('dirty').textContent='';refresh(true)};
cy.on('tap','node',e=>{if(connecting)return pickEndpoint(e.target.id());selected={kind:'concept',id:e.target.id()};refresh();focusSelection()});cy.on('tap','edge',e=>{if(connecting)return;selected={kind:e.target.data('kind')==='property'?'property':'concept',id:e.target.data('ref')};refresh();focusSelection()});$('fit').onclick=()=>cy.fit(undefined,50);
const term=id=>[...model.concepts,...model.properties].find(x=>x.id===id)?.name||id;
function businessRule(r){const subject=term(r.subject),property=term(r.property),target=term(r.target);const condition=r.operator==='someValuesFrom'?`「${property}」でつながる「${target}」が、少なくとも1つある。`:r.operator==='allValuesFrom'?`「${property}」の相手はすべて「${target}」。相手がいない場合も、この条件は満たす。`:`「${property}」でつながる相手は、${({minCardinality:'最低',maxCardinality:'最大',cardinality:'ちょうど'})[r.operator]}${r.count}。`;return `「${subject}」の条件：${condition}`;}
function updateReview(){
  $('yaml-preview').textContent=jsyaml.dump(model);
  const agreed=model.concepts.filter(c=>c.review_state==='agreed').length;
  $('review-board').innerHTML=`<div class="review-intro"><h2>${esc(model.name)}</h2><p>同じことばから、同じ意味を思い浮かべられますか？　${model.concepts.length}個のことば · ${agreed}個が合意済み</p></div><div class="review-grid">${model.concepts.map(c=>`<article class="review-card"><span class="review-status ${esc(c.review_state||'draft')}">${({draft:'考え中',discussion:'要相談',agreed:'合意済み'})[c.review_state||'draft']||'考え中'}</span><h3>${esc(c.name)}</h3>${c.parent?`<p class="hint">${esc(term(c.parent))}の一種</p>`:''}<p>${esc(c.description||'このことばの意味を、一緒に決めましょう。')}</p>${c.example?`<p><strong>たとえば</strong><br>${esc(c.example)}</p>`:''}${c.question?`<p class="question"><strong>相談したいこと</strong><br>${esc(c.question)}</p>`:''}<ul>${model.properties.filter(p=>p.domain===c.id||p.range===c.id).map(p=>`<li>${esc(term(p.domain))} → ${esc(p.name)} → ${esc(term(p.range))}</li>`).join('')}${model.restrictions.filter(r=>r.subject===c.id).map(r=>`<li>${esc(businessRule(r))} <small>［${r.mode==='equivalent'?'呼び分ける条件の一つ':'必ず満たす'}］</small></li>`).join('')}</ul></article>`).join('')}</div>`;
}
function setReview(enabled){connectionState(false);document.body.classList.toggle('reviewing',enabled);$('review-board').hidden=!enabled;$('review-toggle').textContent=enabled?'図に戻る':'みんなで確認';if(enabled)updateReview();cy.resize()}
$('review-toggle').onclick=()=>setReview(!document.body.classList.contains('reviewing'));
cy.on('dragfree','node',e=>{const c=model.concepts.find(c=>c.id===e.target.id());if(c){c.position={...e.target.position()};mark();updateReview()}});
